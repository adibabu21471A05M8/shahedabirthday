<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday My Love</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="confetti-container"></div>

  <main class="page center-page final-page">
    <div class="glass-card">
      <div class="cake">🎂</div>

      <h1>Happy Birthday, My Love! 🎉</h1>

      <h2 id="typingText"></h2>

      <p>
        May your life be filled with unlimited happiness,
        beautiful memories, success, and love.
      </p>

      <button class="btn" onclick="celebrate()">Celebrate Again 🎊</button>

      <p class="final-message">
        You are my favorite person, my sweetest smile,
        and my most beautiful blessing. ❤️
      </p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
